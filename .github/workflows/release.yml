name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/waggle

jobs:
  release:
    name: build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalise the image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Waggle
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WAGGLE_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Write release metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image_lc="${IMAGE,,}"
          cat > waggle-release.env <<EOF
          WAGGLE_VERSION=${VERSION}
          WAGGLE_IMAGE=${image_lc}@${DIGEST}
          WAGGLE_IMAGE_DIGEST=${DIGEST}
          WAGGLE_COSIGN_IDENTITY=https://github.com/${REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}
          WAGGLE_COSIGN_ISSUER=https://token.actions.githubusercontent.com
          EOF
          sha256sum waggle-release.env > waggle-release.env.sha256
          {
            echo "## Waggle ${VERSION}"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${REPOSITORY}/${VERSION}/deploy/install.sh \\"
            echo "  | sudo bash -s -- \\"
            echo "      --source https://github.com/${REPOSITORY}.git --ref ${VERSION} \\"
            echo "      --image ${image_lc}@${DIGEST}"
            echo '```'
            echo
            echo "Verify before installing:"
            echo
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity https://github.com/${REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${image_lc}@${DIGEST}"
            echo '```'
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            waggle-release.env
            waggle-release.env.sha256
