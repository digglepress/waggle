<div class="grid-2 variable-row">
  <div class="field pl-form-field">
    {{ row.name.label_tag }}
    <div class="pl-form-control">{{ row.name }}</div>
    {{ row.name.errors }}
    <label class="variable-remove">{{ row.DELETE }} Remove this variable</label>
  </div>
  <div class="field pl-form-field">
    {{ row.value.label_tag }}
    <div class="pl-form-control">{{ row.value }}</div>
    {{ row.value.errors }}
  </div>
</div>
