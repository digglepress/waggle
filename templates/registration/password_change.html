{% extends "base.html" %}
{% block content %}
<c-page-header title="Change password" />
<c-card>
  <form method="post" class="stack">{% csrf_token %}
    {% for field in form %}<c-field :field="field" />{% endfor %}
    <c-button type="submit" variant="primary">Change password</c-button>
  </form>
</c-card>
{% endblock %}
