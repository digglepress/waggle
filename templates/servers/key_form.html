{% extends "base.html" %}

{% block title %}Add SSH key · {{ app_name }}{% endblock %}

{% block content %}
<c-page-header title="Add an SSH key" subtitle="Paste the private key whose public half is in the node's authorized_keys." />

<c-card>
  <form method="post" class="stack">
    {% csrf_token %}
    {% for error in form.non_field_errors %}
      <c-alert tone="error">{{ error }}</c-alert>
    {% endfor %}
    {% for field in form %}
      <c-field :field="field" />
    {% endfor %}
    <c-form-actions>
      <c-button type="submit" variant="primary">Save key</c-button>
      <c-button href="{% url 'servers:keys' %}" variant="ghost">Cancel</c-button>
    </c-form-actions>
  </form>
</c-card>
{% endblock %}
