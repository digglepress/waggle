version: "3.8"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - target: 80
        published: "${WAGGLE_EDGE_HTTP_PORT:-80}"
        protocol: tcp
        mode: host
      - target: 443
        published: "${WAGGLE_EDGE_HTTPS_PORT:-443}"
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    deploy:
      mode: global
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first

networks:
  proxy:
    external: true
    name: "${WAGGLE_PROXY_NETWORK:-paas_proxy}"
