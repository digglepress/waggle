[project]
name = "waggle"
version = "0.1.0"
description = "A lightweight, Swarm-native PaaS. Coolify's workflow, Docker Swarm's scheduler."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "orchestrator", "provisioning"]
